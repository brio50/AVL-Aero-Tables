name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Fortran and X11 build dependencies
        run: sudo apt-get install -y gfortran libx11-dev

      - name: Build and install AVL 3.52
        run: |
          mkdir -p ~/bin
          curl -fsSL https://web.mit.edu/drela/Public/web/avl/avl3.52.tgz -o avl3.52.tgz
          tar xzf avl3.52.tgz
          cd AVL3.52rel09032025
          cd eispack && make -f Makefile.gfortran && cd ..
          cd plotlib && cp config.make.gfortranDP config.make && make gfortranDP && cd ..
          cd bin && make -f Makefile.gfortranDP
          cp avl ~/bin/avl

      - name: Install Python dependencies
        run: pip install -e ".[dev,export]"

      - name: Run tests
        run: pytest
