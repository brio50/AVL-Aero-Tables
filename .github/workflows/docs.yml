name: Deploy Docs

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # sphinx-multiversion builds one subdirectory per matched git tag
          # / branch (see smv_tag_whitelist/smv_branch_whitelist in
          # docs/conf.py) and needs the full history + tags to find them; the
          # default shallow, single-branch checkout only has the current commit.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install docs dependencies
        run: pip install -e ".[docs]"

      - name: Build versioned Sphinx docs
        run: python -m sphinx_multiversion docs docs/_build/html -W --keep-going

      - name: Generate version switcher + landing-page redirect
        run: |
          python -m sphinx_multiversion docs docs/_build/html --dump-metadata > /tmp/smv-metadata.json
          python docs/_scripts/gen_switcher.py \
            /tmp/smv-metadata.json \
            docs/_build/html \
            "https://brio50.github.io/avl-aero-tables"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
