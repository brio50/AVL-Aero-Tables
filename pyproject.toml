[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "avl-aero-tables"
version = "2.0.2"
description = "Generate aerodynamic lookup tables using AVL (Athena Vortex Lattice)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Brian Borra" }]
dependencies = [
    "numpy",
    "pandas",
    "plotly",
    "pyyaml",
    "pydantic",
    "rich",
]

[project.scripts]
avl-aero-tables = "avl_aero_tables.avl_cli:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "pandas-stubs",
    "types-PyYAML",
]
docs = [
    # sphinx-multiversion (0.2.4, latest on PyPI, unmaintained since ~2021)
    # calls the pre-Sphinx-9 `Config.read(confdir, overrides)` positional
    # signature; Sphinx 9 made `overrides`/`tags` required keyword-only
    # arguments, which breaks it outright (TypeError at build time). Cap
    # below 9 until either project releases a fix.
    "sphinx>=8.2,<9",
    "sphinx-book-theme",
    "myst-parser",
    "sphinx-copybutton",
    "sphinxcontrib-mermaid",
    "sphinx-design",
    "sphinx-autobuild",
    "sphinx-multiversion",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["avl_aero_tables*"]

[tool.pytest.ini_options]
addopts = "--doctest-modules"
testpaths = ["tests", "avl_aero_tables"]
markers = [
    "req: requirement ID(s) this test covers (e.g. req-geom-1)",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = "mpl_toolkits.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "plotly.*"
ignore_missing_imports = true

[tool.sphinx-autobuild]
watch = ["CHANGELOG.md", "CONTRIBUTING.md", "LICENSE.md"]

[tool.sphinx-build.include_deps]
"dev/changelog" = "CHANGELOG.md"
"dev/contributing" = "CONTRIBUTING.md"
"dev/license" = "LICENSE.md"

[tool.ruff.lint]
select = ["E", "F", "I"]
