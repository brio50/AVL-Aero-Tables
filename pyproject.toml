[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "python-avl-wrapper"
version = "1.0.0"
description = "Python wrapper for AVL (Athena Vortex Lattice) by Mark Drela and Harold Youngren (MIT)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Brian Borra" }]
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
]

[project.scripts]
avl-wrapper = "avl_wrapper.avl_cli:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]
docs = [
    "sphinx>=7",
    "sphinx-book-theme",
    "myst-parser",
    "sphinx-copybutton",
    "sphinxcontrib-mermaid",
    "sphinx-design",
    "sphinx-autobuild",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["avl_wrapper*"]

[tool.pytest.ini_options]
addopts = "--doctest-modules"
testpaths = ["tests", "avl_wrapper"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
